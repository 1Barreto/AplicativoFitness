<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Aplicativo</title>
  <meta name="description" content="Treino, medidas e (em breve) dieta, sincronizados entre iPhone e computador.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <script>try { var t = localStorage.getItem('tema'); if (t && t !== 'menta') document.documentElement.dataset.tema = t; } catch (e) {}</script>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <!-- Apple (tela cheia no iPhone quando adicionado à Tela de Início) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aplicativo">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Baixa todos os módulos JS em paralelo (sem esperar um import revelar o próximo) -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/core/util.js">
  <link rel="modulepreload" href="js/core/db.js">
  <link rel="modulepreload" href="js/core/auth.js">
  <link rel="modulepreload" href="js/core/sync.js">
  <link rel="modulepreload" href="js/core/modulos.js">
  <link rel="modulepreload" href="js/core/ui.js">
  <link rel="modulepreload" href="js/core/som.js">
  <link rel="modulepreload" href="js/core/graficos.js">
  <link rel="modulepreload" href="js/core/backup.js">
  <link rel="modulepreload" href="js/core/tema.js">
  <link rel="modulepreload" href="js/modules/index.js">
  <link rel="modulepreload" href="js/modules/hoje.js">
  <link rel="modulepreload" href="js/modules/ajustes.js">
  <link rel="modulepreload" href="js/modules/treino/dados.js">
  <link rel="modulepreload" href="js/modules/treino/exercicios-base.js">
  <link rel="modulepreload" href="js/modules/treino/componentes.js">
  <link rel="modulepreload" href="js/modules/treino/treino.js">
  <link rel="modulepreload" href="js/modules/treino/sessao.js">
  <link rel="modulepreload" href="js/modules/treino/historico.js">
  <link rel="modulepreload" href="js/modules/treino/progresso.js">
  <link rel="modulepreload" href="js/modules/treino/importar-hevy.js">
  <link rel="modulepreload" href="js/modules/treino/fotos.js">
  <link rel="modulepreload" href="js/modules/dieta/dados.js">
  <link rel="modulepreload" href="js/modules/dieta/componentes.js">
  <link rel="modulepreload" href="js/modules/dieta/dieta.js">
  <link rel="modulepreload" href="js/modules/corpo/dados.js">
  <link rel="modulepreload" href="js/modules/corpo/corpo.js">
  <link rel="modulepreload" href="js/modules/perfil/perfil.js">
</head>
<body>
  <header class="topbar">
    <button class="topbar-back" id="btn-voltar" aria-label="Voltar" hidden></button>
    <h1 class="topbar-title" id="titulo">Hoje</h1>
    <div class="topbar-actions">
      <button class="sync-pill" id="sync-pill" aria-label="Status da sincronização"></button>
      <a class="icon-btn" id="btn-ajustes" href="#/ajustes" aria-label="Ajustes"></a>
    </div>
  </header>
  <div id="app">

    <main class="content" id="conteudo" tabindex="-1"></main>

  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
  <div id="barra-treino" class="barra-treino" hidden></div>

  <div id="camada-modal"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Aviso caso o app não consiga iniciar (ex.: index.html aberto direto do disco) -->
  <script>
    (function () {
      function aviso(html) {
        var el = document.getElementById('conteudo');
        if (el) el.innerHTML = '<div class="cartao aviso-inicio">' + html + '</div>';
      }
      if (location.protocol === 'file:') {
        aviso('<h3>Abra o app por um endereço http(s)</h3>' +
          '<p>O navegador bloqueia os scripts do app quando o <code>index.html</code> é aberto direto da pasta (endereço começando com <code>file://</code>).</p>' +
          '<p>Use o endereço do GitHub Pages (ex.: <code>https://seuusuario.github.io/aplicativo/</code>) ou, para testar no computador, rode na pasta do app:</p>' +
          '<p><code>python -m http.server 8080</code></p><p>e abra <code>http://localhost:8080</code>.</p>');
        return;
      }
      var erros = [];
      window.addEventListener('error', function (e) { erros.push(e.message || (e.target && e.target.src) || 'erro'); }, true);
      setTimeout(function () {
        if (!document.querySelector('#tabbar a')) {
          aviso('<h3>O app não conseguiu iniciar</h3><p>Recarregue a página. Se continuar, confira se todos os arquivos e pastas foram enviados (css, js, icons).</p>' +
            (erros.length ? '<p class="sutil">' + erros.join('<br>') + '</p>' : ''));
        }
      }, 5000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
